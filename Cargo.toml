[package]
name = "taw-panel"
version = "0.1.0"
edition = "2021"
description = "The Timster's Audio Works panel look, shared by its native apps"
authors = ["Timster's Audio Works"]
publish = false

[dependencies]
egui = "0.36"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
